<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Pro</title>

<style>
body{margin:0;font-family:Arial;background:#0b1f26;color:white}

/* start */
#start{height:100vh;display:flex;justify-content:center;align-items:center}
.box{background:white;color:black;padding:20px;border-radius:20px;width:90%;max-width:350px;text-align:center}
.box input{width:100%;padding:10px;margin-top:10px;border-radius:10px;border:none}

/* header */
header{background:#202c33;padding:10px;text-align:center}

/* layout */
.container{display:flex}
#messages{flex:3;height:calc(100vh - 120px);overflow:auto;padding:10px;display:flex;flex-direction:column}
#users{
  flex:1;
  background:#111;
  padding:10px;
  border-left:1px solid #333;
  overflow:auto;
}
.user{padding:5px;border-bottom:1px solid #333;font-size:14px}

/* msg */
.msg{display:flex;margin:5px 0}
.me{justify-content:flex-end}
.other{justify-content:flex-start}
.bubble{padding:10px;border-radius:15px;max-width:70%}
.me .bubble{background:#25D366}
.other .bubble{background:#222}
.time{font-size:10px;opacity:.6;display:block;text-align:right}

/* input */
.input-box{position:fixed;bottom:0;width:100%;display:flex;padding:10px;background:#202c33}
.input-box input{flex:1;padding:10px;border-radius:20px;border:none}
.input-box button{margin-left:10px;background:#25D366;border:none;border-radius:50%;width:45px;height:45px;color:white}
</style>
</head>

<body>

<div id="start">
  <div class="box">
    <h2>Chat</h2>
    <input id="name" placeholder="اسمك">
    <input type="file" id="avatarInput">
    <input id="roomInput" placeholder="كود الغرفة">
    <button id="createBtn">إنشاء غرفة</button>
    <button id="joinBtn">دخول</button>
  </div>
</div>

<header id="header" style="display:none;"></header>

<div class="container">
  <div id="messages"></div>
  <div id="users"></div>
</div>

<div class="input-box" id="chatBox" style="display:none;">
  <input id="msgInput">
  <button id="sendBtn">➤</button>
</div>

<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase, ref, push, onChildAdded,
  set, onDisconnect, onValue, update
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyCoQGwJhAaQFKbD8S7TiyjhFelDSVknwIY",
  authDomain:"text-3da14.firebaseapp.com",
  databaseURL:"https://text-3da14-default-rtdb.firebaseio.com/",
  projectId:"text-3da14"
});
const db = getDatabase(app);

/* عناصر */
const startDiv=document.getElementById("start");
const chatBox=document.getElementById("chatBox");
const header=document.getElementById("header");
const messages=document.getElementById("messages");
const usersDiv=document.getElementById("users");

const msgInput=document.getElementById("msgInput");
const nameInput=document.getElementById("name");
const avatarInput=document.getElementById("avatarInput");
const roomInput=document.getElementById("roomInput");
const createBtn=document.getElementById("createBtn");
const joinBtn=document.getElementById("joinBtn");
const sendBtn=document.getElementById("sendBtn");

/* بيانات */
let room="",name="",avatar="",fromLink=false;

/* صورة */
avatarInput.onchange=e=>{
  const r=new FileReader();
  r.onload=()=>avatar=r.result;
  r.readAsDataURL(e.target.files[0]);
};

/* لينك */
const params=new URLSearchParams(location.search);
if(params.get("room")){
  room=params.get("room");
  fromLink=true;
  roomInput.style.display="none";
  joinBtn.innerText="دخول مباشر";
}

/* إنشاء */
createBtn.onclick=()=>{
  name=nameInput.value;
  if(!name)return alert("اكتب اسمك");
  if(!avatar)return alert("اختار صورة");

  room=Math.floor(Math.random()*10000);

  const link=location.origin+location.pathname+"?room="+room;
  navigator.clipboard.writeText(link).catch(()=>{});

  alert("الكود: "+room+"\nتم نسخ لينك الدعوة 🔥");

  startChat();
};

/* دخول */
joinBtn.onclick=()=>{
  name=nameInput.value;
  if(!name)return alert("اكتب اسمك");
  if(!avatar)return alert("اختار صورة");

  if(!fromLink){
    if(!roomInput.value)return alert("اكتب الكود");
    room=roomInput.value;
  }

  startChat();
};

/* تشغيل */
function startChat(){
  startDiv.style.display="none";
  chatBox.style.display="flex";
  header.style.display="block";

  history.pushState({chat:true},"","");

  /* status */
  const s=ref(db,"status/"+room+"/"+name);
  set(s,{state:"online"});
  onDisconnect(s).remove();

  /* users list */
  onValue(ref(db,"status/"+room),(snap)=>{
    let data=snap.val()||{};
    usersDiv.innerHTML="<b>الأعضاء:</b><br>";

    let list=[];
    for(let u in data){
      list.push(u);
      usersDiv.innerHTML+=`<div class="user">🟢 ${u}</div>`;
    }

    header.innerText="Room "+room+" | "+list.length+" online";
  });

  /* typing */
  msgInput.oninput=()=>{
    set(ref(db,"typing/"+room+"/"+name),true);
    setTimeout(()=>set(ref(db,"typing/"+room+"/"+name),false),2000);
  };

  onValue(ref(db,"typing/"+room),(snap)=>{
    let d=snap.val();
    for(let u in d){
      if(d[u]&&u!==name){
        header.innerText=u+" يكتب...";
      }
    }
  });

  /* رسائل */
  onChildAdded(ref(db,"rooms/"+room),(snap)=>{
    let m=snap.val();

    if(m.name!==name&&!m.seen){
      update(ref(db,"rooms/"+room+"/"+snap.key),{seen:true});
    }

    const div=document.createElement("div");
    div.className="msg "+(m.name===name?"me":"other");

    const t=new Date(m.time).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    const seen=m.seen?"✔✔":"✔";

    div.innerHTML=`
    <div style="display:flex;gap:5px;">
      ${m.avatar?`<img src="${m.avatar}" width="30" style="border-radius:50%">`:""}
      <div class="bubble">
        <p>${m.text}</p>
        <span class="time">${t} ${m.name===name?seen:""}</span>
      </div>
    </div>`;

    messages.appendChild(div);
    messages.scrollTop=messages.scrollHeight;
  });
}

/* إرسال */
sendBtn.onclick=()=>{
  if(!msgInput.value)return;

  push(ref(db,"rooms/"+room),{
    name:name,
    text:msgInput.value,
    avatar:avatar,
    time:Date.now(),
    seen:false
  });

  msgInput.value="";
};

/* رجوع */
window.onpopstate=()=>{
  location.href=location.pathname;
};
</script>

</body>
</html>
