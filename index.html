<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Pro</title>

<style>
body { margin:0; font-family:Arial; background:#0b1f26; }

#start {
  height:100vh; display:flex; justify-content:center; align-items:center;
}
.start-box {
  width:90%; max-width:350px; background:white; padding:20px;
  border-radius:20px; text-align:center;
}
.start-box input { width:100%; padding:10px; margin-top:10px; }

header {
  background:#202c33; color:white; padding:10px; text-align:center;
}

#messages {
  height:calc(100vh - 130px);
  overflow:auto; padding:10px;
  display:flex; flex-direction:column;
}

.msg { display:flex; margin:5px 0; }
.me { justify-content:flex-end; }
.other { justify-content:flex-start; }

.bubble {
  max-width:70%; padding:10px; border-radius:15px;
}
.me .bubble { background:#25D366; }
.other .bubble { background:#222; color:white; }

.time { font-size:10px; opacity:.6; display:block; text-align:right; }

.input-box {
  position:fixed; bottom:0; width:100%; display:flex;
  padding:10px; background:#202c33;
}
.input-box input {
  flex:1; padding:10px; border-radius:20px;
}
.input-box button {
  margin-left:10px; border:none; background:#25D366;
  border-radius:50%; width:45px; height:45px; color:white;
}
</style>
</head>

<body>

<div id="start">
  <div class="start-box">
    <h2>Chat</h2>
    <input id="name" placeholder="اسمك">
    <input type="file" id="avatarInput">
    <button onclick="createRoom()">إنشاء غرفة</button>
  </div>
</div>

<header id="header" style="display:none;"></header>
<div id="messages"></div>

<div class="input-box" id="chatBox" style="display:none;">
  <input id="msgInput">
  <button onclick="sendMsg()">➤</button>
</div>

<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase, ref, push, onChildAdded,
  set, onDisconnect, onValue, update
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSy...",
  authDomain:"text-3da14.firebaseapp.com",
  databaseURL:"https://text-3da14-default-rtdb.firebaseio.com/",
  projectId:"text-3da14"
});

const db = getDatabase(app);

let room="", name="", avatar="";

/* صورة */
avatarInput.onchange = e=>{
  let r=new FileReader();
  r.onload=()=>avatar=r.result;
  r.readAsDataURL(e.target.files[0]);
};

/* إنشاء */
window.createRoom=()=>{
  name=nameInput.value;
  if(!name)return alert("اسمك");

  room=Math.floor(Math.random()*10000);

  let link=location.origin+"?room="+room;

  navigator.clipboard.writeText(link).catch(()=>{});
  alert("لينك اتنسخ 🔥");

  start();
};

/* من لينك */
let p=new URLSearchParams(location.search);
if(p.get("room")){
  room=p.get("room");
  name=prompt("اسمك");
  start();
}

/* تشغيل */
function start(){
  start.style.display="none";
  chatBox.style.display="flex";
  header.style.display="block";

  /* status */
  let s=ref(db,"status/"+room+"/"+name);
  set(s,{state:"online",last:Date.now()});
  onDisconnect(s).set({state:"offline",last:Date.now()});

  /* header */
  onValue(ref(db,"status/"+room),(snap)=>{
    let d=snap.val(), online=[];
    for(let u in d){
      if(d[u].state=="online") online.push(u);
    }
    header.innerText=online.join(", ")||"offline";
  });

  /* typing */
  msgInput.oninput=()=>{
    set(ref(db,"typing/"+room+"/"+name),true);
    setTimeout(()=>set(ref(db,"typing/"+room+"/"+name),false),2000);
  };

  onValue(ref(db,"typing/"+room),(snap)=>{
    let d=snap.val();
    for(let u in d){
      if(d[u] && u!=name){
        header.innerText=u+" يكتب...";
      }
    }
  });

  /* messages */
  onChildAdded(ref(db,"rooms/"+room),(snap)=>{
    let m=snap.val();

    if(m.name!=name && !m.seen){
      update(ref(db,"rooms/"+room+"/"+snap.key),{seen:true});
    }

    let div=document.createElement("div");
    div.className="msg "+(m.name==name?"me":"other");

    let t=new Date(m.time).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    let seen=m.seen?"✔✔":"✔";

    div.innerHTML=`
      <div style="display:flex;gap:5px;">
        ${m.avatar?`<img src="${m.avatar}" width="30" style="border-radius:50%">`:""}
        <div class="bubble">
          <p>${m.text}</p>
          <span class="time">${t} ${m.name==name?seen:""}</span>
        </div>
      </div>
    `;

    messages.appendChild(div);
    messages.scrollTop=messages.scrollHeight;

    /* notification */
    if(m.name!=name && Notification.permission=="granted"){
      new Notification(m.name,{body:m.text});
    }
  });
}

/* إرسال */
window.sendMsg=()=>{
  if(!msgInput.value)return;

  push(ref(db,"rooms/"+room),{
    name,text:msgInput.value,
    avatar,time:Date.now(),seen:false
  });

  msgInput.value="";
};

/* إشعارات */
if(Notification.permission!="granted"){
  Notification.requestPermission();
}
</script>

</body>
</html>
