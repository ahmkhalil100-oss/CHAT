<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Pro</title>

<style>
body{margin:0;font-family:Arial;background:#0b1f26;color:white}

/* start */
#start{height:100vh;display:flex;justify-content:center;align-items:center}
.box{background:white;color:black;padding:20px;border-radius:20px;width:90%;max-width:350px;text-align:center}
.box input{width:100%;padding:10px;margin-top:10px;border-radius:10px;border:none}

/* header */
header{background:#202c33;padding:10px;text-align:center}

/* layout */
.container{display:flex}
#messages{flex:3;height:calc(100vh - 140px);overflow:auto;padding:10px;display:flex;flex-direction:column}
#users{flex:1;background:#111;padding:10px;overflow:auto}

/* msg */
.msg{display:flex;margin:5px 0}
.me{justify-content:flex-end}
.other{justify-content:flex-start}
.bubble{padding:10px;border-radius:15px;max-width:70%}
.me .bubble{background:#25D366}
.other .bubble{background:#222}
.time{font-size:10px;opacity:.6}

/* input */
.input-box{position:fixed;bottom:0;width:100%;display:flex;padding:10px;background:#202c33}
.input-box input{flex:1;padding:10px;border-radius:20px;border:none}
.input-box button{margin-left:5px;background:#25D366;border:none;border-radius:50%;width:45px;height:45px;color:white}
</style>
</head>

<body>

<div id="start">
  <div class="box">
    <h2>Chat</h2>
    <input id="name" placeholder="اسمك">
    <input type="file" id="avatarInput">
    <input id="roomInput" placeholder="كود الغرفة">
    <button id="createBtn">إنشاء غرفة</button>
    <button id="joinBtn">دخول</button>
  </div>
</div>

<header id="header" style="display:none;"></header>

<div class="container">
  <div id="messages"></div>
  <div id="users"></div>
</div>

<div class="input-box" id="chatBox" style="display:none;">
  <input id="msgInput">
  <button id="sendBtn">➤</button>
  <input type="file" id="imageInput" accept="image/*">
  <button id="recBtn">🎤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, set, onDisconnect, onValue, update } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const app = initializeApp({
  apiKey:"AIzaSyCoQGwJhAaQFKbD8S7TiyjhFelDSVknwIY",
  authDomain:"text-3da14.firebaseapp.com",
  databaseURL:"https://text-3da14-default-rtdb.firebaseio.com/",
  projectId:"text-3da14"
});

const db = getDatabase(app);
const storage = getStorage(app);

/* عناصر */
const startDiv=document.getElementById("start");
const chatBox=document.getElementById("chatBox");
const header=document.getElementById("header");
const messages=document.getElementById("messages");
const usersDiv=document.getElementById("users");

const msgInput=document.getElementById("msgInput");
const nameInput=document.getElementById("name");
const avatarInput=document.getElementById("avatarInput");
const roomInput=document.getElementById("roomInput");
const createBtn=document.getElementById("createBtn");
const joinBtn=document.getElementById("joinBtn");
const sendBtn=document.getElementById("sendBtn");
const imageInput=document.getElementById("imageInput");
const recBtn=document.getElementById("recBtn");

let room="",name="",avatar="",fromLink=false;

/* صورة */
avatarInput.onchange=e=>{
  let r=new FileReader();
  r.onload=()=>avatar=r.result;
  r.readAsDataURL(e.target.files[0]);
};

/* لينك */
const params=new URLSearchParams(location.search);
if(params.get("room")){
  room=params.get("room");
  fromLink=true;
  roomInput.style.display="none";
  joinBtn.innerText="دخول مباشر";
}

/* إنشاء */
createBtn.onclick=()=>{
  name=nameInput.value;
  if(!name||!avatar)return alert("اسم وصورة");

  room=Math.floor(Math.random()*10000);
  let link=location.origin+"?room="+room;
  navigator.clipboard.writeText(link);
  alert("الكود: "+room);

  startChat();
};

/* دخول */
joinBtn.onclick=()=>{
  name=nameInput.value;
  if(!name||!avatar)return alert("اسم وصورة");

  if(!fromLink){
    if(!roomInput.value)return alert("اكتب الكود");
    room=roomInput.value;
  }
  startChat();
};

/* تشغيل */
function startChat(){
  startDiv.style.display="none";
  chatBox.style.display="flex";
  header.style.display="block";

  const s=ref(db,"status/"+room+"/"+name);
  set(s,{state:"online"});
  onDisconnect(s).remove();

  onValue(ref(db,"status/"+room),(snap)=>{
    let d=snap.val()||{};
    usersDiv.innerHTML="الأعضاء:<br>";
    let count=0;
    for(let u in d){
      count++;
      usersDiv.innerHTML+=`🟢 ${u}<br>`;
    }
    header.innerText="Room "+room+" | "+count;
  });

  onChildAdded(ref(db,"rooms/"+room),(snap)=>{
    let m=snap.val();

    if(m.name!==name&&!m.seen){
      update(ref(db,"rooms/"+room+"/"+snap.key),{seen:true});
    }

    let div=document.createElement("div");
    div.className="msg "+(m.name===name?"me":"other");

    let t=new Date(m.time).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    let seen=m.seen?"✔✔":"✔";

    div.innerHTML=`
    <div>
      ${m.avatar?`<img src="${m.avatar}" width="30">`:""}
      <div class="bubble">
        <p>${m.text||""}</p>
        ${m.image?`<img src="${m.image}" style="max-width:150px">`:""}
        ${m.audio?`<audio controls src="${m.audio}"></audio>`:""}
        <span class="time">${t} ${m.name===name?seen:""}</span>
      </div>
    </div>`;

    messages.appendChild(div);
    messages.scrollTop=messages.scrollHeight;
  });
}

/* إرسال نص */
sendBtn.onclick=()=>{
  if(!msgInput.value)return;

  push(ref(db,"rooms/"+room),{
    name,text:msgInput.value,avatar,time:Date.now(),seen:false
  });

  msgInput.value="";
};

/* إرسال صورة */
imageInput.onchange=async e=>{
  let file=e.target.files[0];
  if(!file)return;

  let r=sRef(storage,"img/"+Date.now());
  await uploadBytes(r,file);
  let url=await getDownloadURL(r);

  push(ref(db,"rooms/"+room),{
    name,avatar,image:url,time:Date.now()
  });
};

/* تسجيل صوت */
let rec;
recBtn.onclick=async()=>{
  let stream=await navigator.mediaDevices.getUserMedia({audio:true});
  rec=new MediaRecorder(stream);
  let chunks=[];

  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=async()=>{
    let blob=new Blob(chunks);
    let r=sRef(storage,"audio/"+Date.now());
    await uploadBytes(r,blob);
    let url=await getDownloadURL(r);

    push(ref(db,"rooms/"+room),{
      name,avatar,audio:url,time:Date.now()
    });
  };

  rec.start();
  setTimeout(()=>rec.stop(),3000);
};
</script>

</body>
</html>
