<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1f26;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* شاشة البداية */
#start {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.start-box {
  width: 90%;
  max-width: 350px;
  background: white;
  padding: 20px;
  border-radius: 20px;
  text-align: center;
}

.start-box input {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border-radius: 10px;
  border: none;
  background: #eee;
}

.start-box button {
  margin-top: 20px;
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 25px;
  background: #25d366;
  color: white;
  font-size: 16px;
}

/* الهيدر */
header {
  background: #202c33;
  color: white;
  padding: 15px;
  text-align: center;
}

/* الرسائل */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  padding-bottom: 80px;
  display: flex;
  flex-direction: column;
}

/* الرسالة */
.msg {
  max-width: 70%;
  padding: 10px;
  margin: 5px;
  border-radius: 10px;
  color: white;
}

/* أنا */
.me {
  align-self: flex-end;
  background: #25d366;
}

/* غيري */
.other {
  align-self: flex-start;
  background: #202c33;
}

/* الكتابة */
.input-box {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  padding: 10px;
  background: #202c33;
  box-sizing: border-box;
}

.input-box input {
  flex: 1;
  padding: 12px;
  border-radius: 25px;
  border: none;
  outline: none;
}

.input-box button {
  margin-left: 10px;
  padding: 0 20px;
  border: none;
  border-radius: 25px;
  background: #25d366;
  color: white;
  font-size: 18px;
}
</style>
</head>

<body>

<!-- البداية -->
<div id="start">
  <div class="start-box">
    <h2>Chat</h2>
    <input id="name" placeholder="اسمك">
    <button onclick="createRoom()">إنشاء غرفة</button>
  </div>
</div>

<!-- الهيدر -->
<header id="roomHeader" style="display:none;"></header>

<!-- الرسائل -->
<div id="messages"></div>

<!-- الكتابة -->
<div class="input-box" id="chatBox" style="display:none;">
  <input id="msgInput" placeholder="اكتب رسالة...">
  <button onclick="sendMsg()">➤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCoQGwJhAaQFKbD8S7TiyjhFelDSVknwIY",
  authDomain: "text-3da14.firebaseapp.com",
  databaseURL: "https://text-3da14-default-rtdb.firebaseio.com/",
  projectId: "text-3da14",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let room = "";
let name = "";

/* قراءة اللينك */
const params = new URLSearchParams(window.location.search);
const roomFromLink = params.get("room");

/* إنشاء غرفة */
window.createRoom = function () {
  name = document.getElementById("name").value;
  if (!name) return alert("اكتب اسمك");

  room = Math.floor(Math.random() * 10000);

  const link = `${window.location.origin}${window.location.pathname}?room=${room}`;

  // نسخ تلقائي
  navigator.clipboard.writeText(link);

  alert("تم نسخ لينك الدعوة 📎");

  startChat();
};

/* دخول من لينك */
if (roomFromLink) {
  name = prompt("اكتب اسمك");
  room = roomFromLink;
  startChat();
}

/* تشغيل */
function startChat() {
  document.getElementById("start").style.display = "none";
  document.getElementById("chatBox").style.display = "flex";
  document.getElementById("roomHeader").style.display = "block";
  document.getElementById("roomHeader").innerText = "Room: " + room;

  const messagesRef = ref(db, "rooms/" + room);

  onChildAdded(messagesRef, (data) => {
    addMsg(data.val());
  });
}

/* إرسال */
window.sendMsg = function () {
  const input = document.getElementById("msgInput");
  const text = input.value;

  if (!text) return;

  const messagesRef = ref(db, "rooms/" + room);

  push(messagesRef, {
    name: name,
    text: text
  });

  input.value = "";
};

/* عرض */
function addMsg(msg) {
  const div = document.createElement("div");
  div.className = "msg " + (msg.name === name ? "me" : "other");
  div.innerText = msg.name + ": " + msg.text;

  const messages = document.getElementById("messages");
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
</html>
