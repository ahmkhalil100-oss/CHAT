<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1f26;
}

/* البداية */
#start {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.start-box {
  width: 90%;
  max-width: 350px;
  background: white;
  padding: 20px;
  border-radius: 20px;
  text-align: center;
}

.start-box input {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border-radius: 10px;
  border: none;
  background: #eee;
}

.start-box button {
  margin-top: 20px;
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 25px;
  background: #25d366;
  color: white;
  font-size: 16px;
}

/* الشات */
header {
  background: #202c33;
  color: white;
  padding: 15px;
  text-align: center;
}

#messages {
  height: calc(100vh - 120px);
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
}

.msg {
  max-width: 70%;
  padding: 10px;
  margin: 5px;
  border-radius: 10px;
  color: white;
}

.me {
  align-self: flex-end;
  background: #25d366;
}

.other {
  align-self: flex-start;
  background: #202c33;
}

.input-box {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  padding: 10px;
  background: #202c33;
}

.input-box input {
  flex: 1;
  padding: 12px;
  border-radius: 25px;
  border: none;
}

.input-box button {
  margin-left: 10px;
  padding: 0 20px;
  border: none;
  border-radius: 25px;
  background: #25d366;
  color: white;
}
</style>
</head>

<body>

<div id="start">
  <div class="start-box">
    <h2>Chat</h2>
    <input id="name" placeholder="اسمك">
    <button onclick="createRoom()">إنشاء غرفة</button>
  </div>
</div>

<header id="roomHeader" style="display:none;"></header>
<div id="messages"></div>

<div class="input-box" id="chatBox" style="display:none;">
  <input id="msgInput" placeholder="اكتب رسالة...">
  <button onclick="sendMsg()">➤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCoQGwJhAaQFKbD8S7TiyjhFelDSVknwIY",
  authDomain: "text-3da14.firebaseapp.com",
  databaseURL: "https://text-3da14-default-rtdb.firebaseio.com/",
  projectId: "text-3da14",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let room = "";
let name = "";

/* زرار إنشاء */
window.createRoom = function () {
  name = document.getElementById("name").value;

  if (!name) {
    alert("اكتب اسمك");
    return;
  }

  room = Math.floor(Math.random() * 10000);

  const link = location.origin + location.pathname + "?room=" + room;

  // نحاول ننسخ
  navigator.clipboard.writeText(link).then(() => {
    alert("تم نسخ لينك الدعوة 📎\n" + link);
  }).catch(() => {
    alert("انسخ اللينك ده 👇\n" + link);
  });

  startChat();
};

/* دخول من لينك */
const params = new URLSearchParams(location.search);
if (params.get("room")) {
  room = params.get("room");
  name = prompt("اكتب اسمك");
  startChat();
}

/* تشغيل */
function startChat() {
  document.getElementById("start").style.display = "none";
  document.getElementById("chatBox").style.display = "flex";
  document.getElementById("roomHeader").style.display = "block";
  document.getElementById("roomHeader").innerText = "Room: " + room;

  const messagesRef = ref(db, "rooms/" + room);

  onChildAdded(messagesRef, (data) => {
    const msg = data.val();

    const div = document.createElement("div");
    div.className = "msg " + (msg.name === name ? "me" : "other");
    div.innerText = msg.name + ": " + msg.text;

    const messages = document.getElementById("messages");
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  });
}

/* إرسال */
window.sendMsg = function () {
  const input = document.getElementById("msgInput");

  if (!input.value) return;

  push(ref(db, "rooms/" + room), {
    name: name,
    text: input.value
  });

  input.value = "";
};
</script>

</body>
</html>
