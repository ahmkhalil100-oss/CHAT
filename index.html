<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Chat</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1c26;
  color:white;
}

#login, #chat {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

input {
  padding:10px;
  margin:5px;
  width:200px;
}

button {
  padding:10px;
  margin:5px;
  background:#2ecc71;
  border:none;
  color:white;
  cursor:pointer;
}

#messages {
  height:70vh;
  overflow-y:auto;
  width:90%;
}

.msg {
  background:#1e3a4c;
  margin:5px;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div id="login">
  <h2>💬 Chat</h2>
  <input id="name" placeholder="اسمك">
  <input id="room" placeholder="كود الغرفة">
  <button onclick="createRoom()">إنشاء</button>
  <button onclick="joinRoom()">دخول</button>
</div>

<div id="chat" style="display:none;">
  <h3 id="roomTitle"></h3>
  <div id="messages"></div>
  <input id="msg" placeholder="اكتب رسالة">
  <button onclick="sendMsg()">إرسال</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCoQGwJhAaQFKbD8S7TiyjhFelDSVknwIY",
  authDomain: "text-3da14.firebaseapp.com",
  databaseURL: "https://text-3da14-default-rtdb.firebaseio.com/",
  projectId: "text-3da14",
  storageBucket: "text-3da14.appspot.com",
  messagingSenderId: "525716174257",
  appId: "1:525716174257:web:38cbd81b462f894eab7990"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let username = "";
let room = "";

window.createRoom = function() {
  username = document.getElementById("name").value;
  room = Math.floor(Math.random()*10000).toString();
  startChat();
}

window.joinRoom = function() {
  username = document.getElementById("name").value;
  room = document.getElementById("room").value;
  startChat();
}

function startChat(){
  document.getElementById("login").style.display = "none";
  document.getElementById("chat").style.display = "flex";
  document.getElementById("roomTitle").innerText = "Room: " + room;

  const chatRef = ref(db, "rooms/" + room);

  onChildAdded(chatRef, (data) => {
    const msg = data.val();
    const div = document.createElement("div");
    div.className = "msg";
    div.innerText = msg.name + ": " + msg.text;
    document.getElementById("messages").appendChild(div);
  });
}

window.sendMsg = function(){
  const text = document.getElementById("msg").value;
  if(text === "") return;

  push(ref(db, "rooms/" + room), {
    name: username,
    text: text
  });

  document.getElementById("msg").value = "";
}
</script>

</body>
</html>
