<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat App</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1f22;
  color:white;
}

.container {
  padding:20px;
  text-align:center;
}

input {
  width:90%;
  padding:15px;
  margin:10px 0;
  border:none;
  border-radius:25px;
  font-size:16px;
}

button {
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#25D366;
  color:white;
  font-size:16px;
}

#chat {
  display:none;
  height:100vh;
  flex-direction:column;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg {
  background:#202c33;
  padding:10px;
  border-radius:15px;
  margin:5px;
  width:fit-content;
}

.me {
  background:#25D366;
  margin-left:auto;
}

.bottom {
  display:flex;
  padding:10px;
}

.bottom input {
  flex:1;
}

</style>
</head>

<body>

<!-- 🔐 تسجيل الدخول -->
<div class="container" id="auth">
  <h2>تسجيل الدخول</h2>
  <input type="email" id="email" placeholder="الايميل">
  <input type="password" id="pass" placeholder="الباسورد">
  <br>
  <button onclick="login()">دخول</button>
  <button onclick="signup()">إنشاء حساب</button>
</div>

<!-- 🚪 دخول الغرفة -->
<div class="container" id="room" style="display:none;">
  <h2>ادخل الغرفة</h2>
  <input id="roomCode" placeholder="كود الغرفة">
  <br>
  <button onclick="joinRoom()">دخول</button>
</div>

<!-- 💬 الشات -->
<div id="chat">
  <div id="messages"></div>

  <div class="bottom">
    <input id="msg" placeholder="اكتب رسالة...">
    <button onclick="send()">➤</button>
  </div>
</div>

<!-- Firebase -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCoQGwJhAaQFKbD8S7TiyjhFelDSVknwIY",
  authDomain: "text-3da14.firebaseapp.com",
  databaseURL: "https://text-3da14-default-rtdb.firebaseio.com",
  projectId: "text-3da14",
  storageBucket: "text-3da14.firebasestorage.app",
  messagingSenderId: "525716174257",
  appId: "1:525716174257:web:38cbd81b462f894eab7990"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getDatabase();

let currentRoom = "";
let user = "";

window.signup = () => {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("pass").value;

  createUserWithEmailAndPassword(auth, email, pass)
    .then(()=>{
      alert("تم إنشاء الحساب");
    })
    .catch(e=>alert(e.message));
};

window.login = () => {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("pass").value;

  signInWithEmailAndPassword(auth, email, pass)
    .then(()=>{
      user = email;
      document.getElementById("auth").style.display="none";
      document.getElementById("room").style.display="block";
    })
    .catch(e=>alert(e.message));
};

window.joinRoom = () => {
  currentRoom = document.getElementById("roomCode").value;

  if(!currentRoom) return alert("اكتب كود");

  document.getElementById("room").style.display="none";
  document.getElementById("chat").style.display="flex";

  const messagesRef = ref(db, "rooms/" + currentRoom);

  onChildAdded(messagesRef, (data)=>{
    const msg = data.val();

    const div = document.createElement("div");
    div.className = "msg " + (msg.user===user ? "me":"");
    div.innerText = msg.user + ": " + msg.text;

    document.getElementById("messages").appendChild(div);
  });
};

window.send = () => {
  const text = document.getElementById("msg").value;

  if(!text) return;

  push(ref(db, "rooms/" + currentRoom), {
    user:user,
    text:text
  });

  document.getElementById("msg").value="";
};

</script>

</body>
</html>
