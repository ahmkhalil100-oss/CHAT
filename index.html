<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#0f2a2d;
  color:white;
  text-align:center;
}

.container{
  padding:20px;
}

input{
  width:80%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin:10px;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  background:#25d366;
  color:white;
  font-size:16px;
}

#chat{
  display:none;
  flex-direction:column;
  height:100vh;
}

#messages{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg{
  background:#1f3a3d;
  padding:10px;
  border-radius:10px;
  margin:5px;
  text-align:left;
}

.me{
  background:#25d366;
  text-align:right;
}

#sendBox{
  display:flex;
  padding:10px;
}

#msgInput{
  flex:1;
}
</style>
</head>

<body>

<!-- تسجيل -->
<div class="container" id="login">
  <h2>اسمك</h2>
  <input id="name" placeholder="اكتب اسمك">
  <br>
  <button onclick="enter()">دخول</button>
</div>

<!-- الغرف -->
<div class="container" id="room" style="display:none;">
  <h2>الغرف</h2>

  <input id="roomCode" placeholder="كود الغرفة">
  <br>

  <button onclick="joinRoom()">دخول</button>

  <br><br>

  <button onclick="createRoom()">➕ إنشاء غرفة</button>

  <p id="myCode"></p>
</div>

<!-- الشات -->
<div id="chat">
  <div id="messages"></div>

  <div id="sendBox">
    <input id="msgInput" placeholder="اكتب رسالة">
    <button onclick="send()">➤</button>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCoQGwJhAaQFKbD8S7TiyjhFelDSVknwIY",
  authDomain: "text-3da14.firebaseapp.com",
  databaseURL: "https://text-3da14-default-rtdb.firebaseio.com",
  projectId: "text-3da14",
  storageBucket: "text-3da14.appspot.com",
  messagingSenderId: "525716174257",
  appId: "1:525716174257:web:38cbd81b462f894eab7990"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let user = "";
let currentRoom = "";

/* تسجيل دخول */
window.enter = () => {
  user = document.getElementById("name").value;
  if(!user) return alert("اكتب اسمك");

  localStorage.setItem("chatUser", user);

  document.getElementById("login").style.display="none";
  document.getElementById("room").style.display="block";
};

/* إنشاء غرفة */
window.createRoom = async () => {
  const code = Math.floor(1000 + Math.random() * 9000);
  currentRoom = code.toString();

  const link = location.origin + location.pathname + "?room=" + currentRoom;

  document.getElementById("myCode").innerText =
    "كود الغرفة: " + currentRoom + "\nتم نسخ لينك الدعوة ✔";

  await navigator.clipboard.writeText(link);

  openChat();
};

/* دخول غرفة */
window.joinRoom = () => {
  const code = document.getElementById("roomCode").value;
  if(!code) return alert("اكتب الكود");

  currentRoom = code;
  openChat();
};

/* فتح الشات */
function openChat(){
  document.getElementById("room").style.display="none";
  document.getElementById("chat").style.display="flex";

  const messagesRef = ref(db, "rooms/" + currentRoom);

  onChildAdded(messagesRef, (data)=>{
    const msg = data.val();

    const div = document.createElement("div");
    div.className = "msg " + (msg.user===user ? "me":"");
    div.innerText = msg.user + ": " + msg.text;

    document.getElementById("messages").appendChild(div);
  });
}

/* إرسال رسالة */
window.send = () => {
  const text = document.getElementById("msgInput").value;
  if(!text) return;

  push(ref(db, "rooms/" + currentRoom), {
    user,
    text
  });

  document.getElementById("msgInput").value="";
};

/* دخول من لينك دعوة */
const urlParams = new URLSearchParams(window.location.search);
const roomFromLink = urlParams.get("room");

const savedUser = localStorage.getItem("chatUser");

if(roomFromLink){
  if(savedUser){
    user = savedUser;
    currentRoom = roomFromLink;

    document.getElementById("login").style.display="none";
    openChat();
  } else {
    document.getElementById("login").style.display="block";

    window.enter = () => {
      user = document.getElementById("name").value;
      if(!user) return;

      localStorage.setItem("chatUser", user);

      currentRoom = roomFromLink;
      document.getElementById("login").style.display="none";
      openChat();
    };
  }
}

/* تسجيل دخول تلقائي */
if(savedUser && !roomFromLink){
  user = savedUser;
  document.getElementById("login").style.display="none";
  document.getElementById("room").style.display="block";
}

</script>

</body>
</html>
