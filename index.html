<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1f23;
  color: white;
}

/* صفحات */
.page {
  display: none;
  height: 100vh;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.active {
  display: flex;
}

input {
  padding: 12px;
  margin: 8px;
  border-radius: 8px;
  border: none;
  width: 80%;
}

button {
  padding: 12px;
  margin: 8px;
  border-radius: 8px;
  border: none;
  background: #25D366;
  color: white;
  font-weight: bold;
}

/* الشات */
#chatPage {
  display: none;
  flex-direction: column;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.msg {
  background: #1f2c34;
  padding: 10px;
  border-radius: 10px;
  margin: 5px;
  max-width: 70%;
}

.me {
  background: #25D366;
  margin-left: auto;
}

#sendBox {
  display: flex;
  padding: 10px;
  background: #111;
}

#sendBox input {
  flex: 1;
}

</style>
</head>

<body>

<!-- تسجيل -->
<div id="authPage" class="page active">
  <h2>تسجيل / دخول</h2>
  <input id="email" placeholder="الايميل">
  <input id="password" type="password" placeholder="الباسورد">
  <button onclick="register()">إنشاء حساب</button>
  <button onclick="login()">تسجيل دخول</button>
</div>

<!-- اختيار غرفة -->
<div id="roomPage" class="page">
  <h2>ادخل الغرفة</h2>
  <input id="roomInput" placeholder="كود الغرفة">
  <button onclick="enterRoom()">دخول</button>
</div>

<!-- الشات -->
<div id="chatPage">
  <div style="padding:10px;background:#111">
    Room: <span id="roomId"></span>
    <button onclick="logout()">خروج</button>
  </div>

  <div id="messages"></div>

  <div id="sendBox">
    <input id="msgInput" placeholder="اكتب رسالة...">
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<!-- Firebase -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "YOUR_DB_URL",
  projectId: "YOUR_ID",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentRoom = "";

/* صفحات */
function show(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* تسجيل */
window.register = function() {
  createUserWithEmailAndPassword(auth,
    email.value, password.value)
    .then(() => {
      alert("تم إنشاء الحساب");
    });
}

/* دخول */
window.login = function() {
  signInWithEmailAndPassword(auth,
    email.value, password.value)
    .then(() => {
      show("roomPage");
    });
}

/* خروج */
window.logout = function() {
  signOut(auth);
  location.reload();
}

/* دخول غرفة */
window.enterRoom = function() {
  currentRoom = roomInput.value;
  document.getElementById("roomId").innerText = currentRoom;

  document.getElementById("authPage").style.display = "none";
  document.getElementById("roomPage").style.display = "none";
  document.getElementById("chatPage").style.display = "flex";

  const messagesRef = ref(db, "rooms/" + currentRoom);

  onChildAdded(messagesRef, snap => {
    const msg = snap.val();

    const div = document.createElement("div");
    div.className = "msg";

    if (msg.uid === auth.currentUser.uid) {
      div.classList.add("me");
    }

    div.innerText = msg.text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  });
}

/* ارسال */
window.sendMsg = function() {
  if (!msgInput.value) return;

  push(ref(db, "rooms/" + currentRoom), {
    text: msgInput.value,
    uid: auth.currentUser.uid
  });

  msgInput.value = "";
}

</script>

</body>
</html>
