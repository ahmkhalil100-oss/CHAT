<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b1f26;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #202c33;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .msg {
      max-width: 70%;
      padding: 10px;
      margin: 5px;
      border-radius: 10px;
      color: white;
      word-wrap: break-word;
    }

    .me {
      align-self: flex-end;
      background: #25d366;
    }

    .other {
      align-self: flex-start;
      background: #202c33;
    }

    .input-box {
      display: flex;
      padding: 10px;
      background: #202c33;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    button {
      margin-left: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 20px;
      background: #25d366;
      color: white;
      font-weight: bold;
    }

    #start {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #start input {
      margin: 10px;
      width: 200px;
    }
  </style>
</head>

<body>

<div id="start">
  <h2>Chat</h2>
  <input id="name" placeholder="اسمك">
  <button onclick="createRoom()">إنشاء غرفة</button>
</div>

<header id="roomHeader" style="display:none;"></header>

<div id="messages"></div>

<div class="input-box" id="chatBox" style="display:none;">
  <input id="msgInput" placeholder="اكتب رسالة...">
  <button onclick="sendMsg()">➤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com/",
  projectId: "YOUR_PROJECT",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let room = "";
let name = "";

// قراءة اللينك
const params = new URLSearchParams(window.location.search);
const roomFromLink = params.get("room");

if (roomFromLink) {
  document.getElementById("start").style.display = "flex";
}

// إنشاء غرفة
window.createRoom = function () {
  name = document.getElementById("name").value;
  if (!name) return alert("اكتب اسمك");

  room = Math.floor(Math.random() * 10000);

  const link = `${window.location.origin}${window.location.pathname}?room=${room}`;
  alert("لينك الدعوة:\n" + link);

  startChat();
};

// دخول تلقائي من لينك
if (roomFromLink) {
  setTimeout(() => {
    name = prompt("اكتب اسمك");
    room = roomFromLink;
    startChat();
  }, 500);
}

// بدء الشات
function startChat() {
  document.getElementById("start").style.display = "none";
  document.getElementById("chatBox").style.display = "flex";
  document.getElementById("roomHeader").style.display = "block";
  document.getElementById("roomHeader").innerText = "Room: " + room;

  const messagesRef = ref(db, "rooms/" + room);

  onChildAdded(messagesRef, (data) => {
    const msg = data.val();
    addMsg(msg);
  });
}

// إرسال رسالة
window.sendMsg = function () {
  const input = document.getElementById("msgInput");
  const text = input.value;

  if (!text) return;

  const messagesRef = ref(db, "rooms/" + room);

  push(messagesRef, {
    name: name,
    text: text
  });

  input.value = "";
};

// عرض الرسالة
function addMsg(msg) {
  const div = document.createElement("div");
  div.className = "msg " + (msg.name === name ? "me" : "other");
  div.innerText = msg.name + ": " + msg.text;

  const messages = document.getElementById("messages");
  messages.appendChild(div);

  messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
</html>
