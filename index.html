<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1c26;
  color:white;
}

#login, #chat {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  padding:10px;
}

input {
  padding:12px;
  margin:5px;
  width:90%;
  max-width:300px;
  border-radius:10px;
  border:none;
}

button {
  padding:12px;
  margin:5px;
  width:90%;
  max-width:300px;
  background:#25D366;
  border:none;
  color:white;
  border-radius:10px;
}

#messages {
  width:100%;
  height:65vh;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
}

.msg {
  padding:10px;
  margin:5px;
  border-radius:10px;
  max-width:70%;
  word-wrap:break-word;
}

.me {
  background:#25D366;
  align-self:flex-end;
}

.other {
  background:#1e3a4c;
  align-self:flex-start;
}

#sendBox {
  display:flex;
  width:100%;
}

#msg {
  flex:1;
}
</style>
</head>

<body>

<div id="login">
  <h2>💬 Chat</h2>
  <input id="name" placeholder="اسمك">
  <input id="room" placeholder="كود الغرفة">
  <button onclick="createRoom()">إنشاء</button>
  <button onclick="joinRoom()">دخول</button>
</div>

<div id="chat" style="display:none;">
  <h3 id="roomTitle"></h3>

  <div id="messages"></div>

  <div id="sendBox">
    <input id="msg" placeholder="اكتب رسالة">
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyCoQGwJhAaQFKbD8S7TiyjhFelDSVknwIY",
  authDomain: "text-3da14.firebaseapp.com",
  databaseURL: "https://text-3da14-default-rtdb.firebaseio.com/",
  projectId: "text-3da14"
});

const db = getDatabase(app);

let username = "";
let room = "";

window.createRoom = function() {
  username = document.getElementById("name").value;
  room = Math.floor(Math.random()*10000).toString();
  start();
}

window.joinRoom = function() {
  username = document.getElementById("name").value;
  room = document.getElementById("room").value;
  start();
}

function start(){
  document.getElementById("login").style.display="none";
  document.getElementById("chat").style.display="flex";
  document.getElementById("roomTitle").innerText="Room: "+room;

  const r = ref(db, "rooms/"+room);

  onChildAdded(r, (d)=>{
    let m = d.val();

    let div = document.createElement("div");
    div.classList.add("msg");

    if(m.name === username){
      div.classList.add("me");
    } else {
      div.classList.add("other");
    }

    div.innerText = m.name + ": " + m.text;

    document.getElementById("messages").appendChild(div);
  });
}

window.sendMsg = function(){
  let t = document.getElementById("msg").value;
  if(t==="") return;

  push(ref(db, "rooms/"+room), {
    name: username,
    text: t
  });

  document.getElementById("msg").value="";
}
</script>

</body>
</html>
